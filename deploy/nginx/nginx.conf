# StrollWay: one origin for the SPA, the API and Django static files.
# Traffic comes from cloudflared (production) or from localhost (local run).

# Cloudflare sends the real visitor IP and the original scheme. Locally they are missing,
# so fall back to the TCP address and "http".
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 1m;
    server_tokens off;

    location /api/ {
        # No URI after the host: the path goes to Django unchanged, with the /api/ prefix.
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        # Overwrite, never append: the client cannot add its own fake IPs. DRF NUM_PROXIES=1.
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 125s;
    }

    location /static/ {
        # Served by WhiteNoise inside Django.
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Hashed build files never change: cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # SPA: unknown paths get index.html, and React Router shows the right page.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# Install once: backend\.venv\Scripts\pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
        exclude: tsconfig.*\.json$  # JSONC with comments
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1000]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Uses the Prettier version installed in frontend/, so it matches CI exactly.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        entry: npm --prefix frontend exec -- prettier --write --ignore-unknown
        files: ^frontend/
        exclude: ^frontend/package-lock\.json$

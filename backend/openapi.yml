        name:
          type: string
          minLength: 1
          maxLength: 80
        start_lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
        start_lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
        end_lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
        end_lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
        start_label:
          type: string
          maxLength: 120
        end_label:
          type: string
          maxLength: 120
        avoid_stairs:
          type: boolean
        distance_m:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64

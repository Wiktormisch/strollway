  /api/trip-ideas/:
    post:
      operationId: trip_ideas_create
      description: Finds places around the start (OpenStreetMap), lets an LLM or simple
        rules pick and order 1-4 stops, then routes start -> stops (-> start) without
        stairs and checks the time limit. `engine` tells who planned it. Only `wishes`
        (max 200 characters) is sent to the LLM as free text; never coordinates. Limited
        to 20 requests per hour per IP.
      summary: Plan a short family trip from a start point
      parameters:
      - in: header
        name: X-Client-Id
        schema:
          type: string
          format: uuid
        description: A random UUID that identifies this browser. All data is filtered
          by it. When it is missing, the shared "demo" client is used; it is read-only,
          so POST, PUT, PATCH and DELETE without this header give 400. A value that
          is not a UUID gives 400.
      tags:
      - trip-ideas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripIdeaRequestRequest'
            examples:
              DemoTripStart(GdanskChelm):
                value:
                  start:
                    lat: 54.3385
                    lng: 18.62
                  max_minutes: 90
                  round_trip: true
                  language: en
                  wishes: playground, then ice cream, finally pizza
                summary: Demo trip start (Gdansk Chelm)
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TripIdeaRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TripIdeaRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripIdeaResponse'
              examples:
                ARule-basedTrip:
                  value:
                    engine: rules
                    source: mock
                    step_free_available: null
                    route:
                      geometry:
                      - - 54.3385
                        - 18.62
                      - - 54.3391
                        - 18.6195
                      - - 54.3385
                        - 18.62
                      distance_m: 180
                      duration_min: 3
                      stairs_m: null
                      stairs_segments: []
                    baseline:
                      geometry:
                      - - 54.3385
                        - 18.62
                      - - 54.3391
                        - 18.6195
                      - - 54.3385
                        - 18.62
                      distance_m: 180
                      duration_min: 3
                      stairs_m: null
                      stairs_segments: []
                    detour_m: null
                    extra_min: null
                    summary: 'A plan from simple rules: playground.'
                    tips: []
                    unmet_wishes:
                    - 'pizza: does not fit in the time limit'
                    stops:
                    - poi_id: node/1
                      name: null
                      category: playground
                      lat: 54.3391
                      lng: 18.6195
                      distance_m: 70
                      opening_hours: null
                      open_now: null
                      arrive_min: 1
                      planned_minutes: 30
                      reason: The closest place of this kind, about 70 m from the
                        start.
                    dropped_stops: []
                    walking_min: 3
                    stops_min: 30
                    total_min: 33
                    max_minutes: 45
                    over_limit: false
                    weather: null
                    transit_stops:
                    - name: Sikorskiego
                      kind: bus
                      near: start
                      distance_m: 40
                  summary: A rule-based trip
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripValidationError'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripIdeaError'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripThrottled'
          description: ''

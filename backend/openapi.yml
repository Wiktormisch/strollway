        * `unavailable` - unavailable
        * `outside_area` - outside_area
    Route:
      type: object
      properties:
        geometry:
          type: array
          items:
            type: array
            items:
              type: number
              format: double
            maxItems: 2
            minItems: 2
          description: '[[lat, lng], ...]'
        distance_m:
          type: integer
        duration_min:
          type: integer

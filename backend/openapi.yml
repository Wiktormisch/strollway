components:
  schemas:
    CategoryEnum:
      enum:
      - playground
      - indoor_play
      - skatepark
      - toilets
      - cafe
      - restaurant
      - bench
      - water
      - park
      - zoo
      - museum
      - beach
      - shop
      - other
      type: string
      description: |-
        * `playground` - Playground
        * `indoor_play` - Indoor play
        * `skatepark` - Skatepark
        * `toilets` - Toilets
        * `cafe` - Cafe
        * `restaurant` - Restaurant
        * `bench` - Bench
        * `water` - Water
        * `park` - Park
        * `zoo` - Zoo
        * `museum` - Museum
        * `beach` - Beach
        * `shop` - Shop
        * `other` - Other
    DroppedStop:
      type: object
      properties:
        poi_id:
          type: string
        name:
          type: string
          nullable: true
      required:
      - name
      - poi_id
    EngineEnum:
      enum:
      - rules
      - claude_cli
      - anthropic
      - nvidia
      type: string
      description: |-
        * `rules` - rules
        * `claude_cli` - claude_cli
        * `anthropic` - anthropic
        * `nvidia` - nvidia
    FamilyProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 60
        children_ages:
          type: array
          items:
            type: integer
        wheels:
          $ref: '#/components/schemas/WheelsEnum'
        pace_kmh:
          type: number
          format: double
          maximum: 5.5
          minimum: 2.5
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    FamilyProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        children_ages:
          type: array
          items:

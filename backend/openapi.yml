          format: int64
        geometry:
          type: array
          items:
            type: array
            items:
              type: number
            minItems: 2
            maxItems: 2
          description: '[[lat, lng], ...]'
        status:
          $ref: '#/components/schemas/StatusEnum'
        rating:
          type: integer
          maximum: 5
          minimum: 1
          nullable: true
        notes:
          type: string
          maxLength: 1000
        ai_summary:
          type: string
          maxLength: 2000
        stops:
          type: array
          items:
            $ref: '#/components/schemas/NestedStopRequest'
    Poi:
      type: object
      properties:
        poi_id:
          type: string
          description: OSM id, e.g. "node/123".
        name:
          type: string
          nullable: true
        category:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        at_min:
          type: integer
          description: Minutes from the start to the nearest point.
        off_route_m:
          type: integer
        opening_hours:
          type: string
          nullable: true
          description: Raw OSM text.
        open_now:
          type: boolean
          nullable: true
          description: null = unknown.

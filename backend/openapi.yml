  /api/route-plans/:
    post:
      operationId: route_plans_create
      description: 'Compares the shortest walking route with a step-free one and lists
        places along the route. Coordinates are [lat, lng]. Upstream failures never
        give 500: the answer falls back to a recorded demo route (`source: fixture`)
        or a straight line (`source: mock`). Limited to 60 requests per hour per IP.'
      summary: Plan a step-free route from A to B
      parameters:
      - in: header
        name: X-Client-Id
        schema:
          type: string
          format: uuid
        description: A random UUID that identifies this browser. All data is filtered
          by it. When it is missing, the shared "demo" client is used; it is read-only,
          so POST, PUT, PATCH and DELETE without this header give 400. A value that
          is not a UUID gives 400.
      tags:
      - route-plans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutePlanRequestRequest'
            examples:
              DemoPair1(bigDetour):
                value:
                  start:
                    lat: 54.347791
                    lng: 18.618119
                  end:
                    lat: 54.34874
                    lng: 18.618458
                  avoid_stairs: true
                summary: Demo pair 1 (big detour)
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoutePlanRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoutePlanRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutePlanResponse'
              examples:
                Step-freeRouteWithADetour:
                  value:
                    source: ors
                    step_free_available: true
                    route:
                      geometry:
                      - - 54.347791
                        - 18.618119
                      - - 54.34874
                        - 18.618458
                      distance_m: 420
                      duration_min: 6
                      stairs_m: 0
                      stairs_segments: []
                    baseline:
                      geometry:
                      - - 54.347791
                        - 18.618119
                      - - 54.34874
                        - 18.618458
                      distance_m: 132
                      duration_min: 2
                      stairs_m: 16.0
                      stairs_segments:
                      - - - 54.348
                          - 18.6182
                        - - 54.3481
                          - 18.6183
                    detour_m: 288
                    extra_min: 4
                    pois_status: ok
                    pois:
                    - poi_id: node/123
                      name: null
                      category: bench
                      lat: 54.348
                      lng: 18.618
                      at_min: 3
                      off_route_m: 12
                      opening_hours: null
                      open_now: null
                    transit_stops:
                    - name: Hucisko
                      kind: tram
                      near: start
                      distance_m: 180
                  summary: Step-free route with a detour
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutePlanError'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Throttled'
          description: ''

openapi: 3.0.3
info:
  title: StrollWay API
  version: 0.1.0
  description: Stair-free walks for families with a stroller.
paths:
  /api/demo-data/:
    post:
      operationId: demo_data_create
      description: |-
        Reads the client id before any action, so a bad header gives 400 before a 404.

        Also limits writes per IP and keeps the shared demo client read-only.
      parameters:
      - in: header
        name: X-Client-Id
        schema:
          type: string
          format: uuid
        description: A random UUID that identifies this browser. All data is filtered
          by it. When it is missing, the shared "demo" client is used; it is read-only,
          so POST, PUT, PATCH and DELETE without this header give 400. A value that
          is not a UUID gives 400.
      tags:
      - demo-data
      security:
      - {}
      responses:
        '201':
          description: Demo data was created.
        '200':
          description: Demo data already existed; nothing changed.
  /api/health/:
    get:
      operationId: health_retrieve
      description: Tell the frontend that the API is up and which engines are active.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''

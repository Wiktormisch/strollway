        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
      required:
      - lat
      - lng
    PoisStatusEnum:
      enum:
      - ok
      - unavailable
      - outside_area
